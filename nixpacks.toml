[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "libGL",
  "glib",
  "stdenv.cc.cc.lib",
]

[phases.install]
cmds = [
  "python3.11 -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
